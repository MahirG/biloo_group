name: Format Biloo ERP navigation

on:
  push:
    branches: [agent/biloo-erp-navigation]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/biloo-erp-navigation
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run format
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm run format:check
      - name: Remove trigger file
        run: rm -f .biloo-erp-format-trigger
      - name: Commit formatted ERP integration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Format Biloo ERP navigation"
          git push origin HEAD:agent/biloo-erp-navigation
