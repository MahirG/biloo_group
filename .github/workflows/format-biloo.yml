name: Format BILOO branch

on:
  push:
    branches:
      - agent/biloo-mvp-foundation

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/biloo-mvp-foundation
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Apply repository formatting
        run: npx prettier --write src/components/biloo src/data/biloo.ts

      - name: Commit formatting
        run: |
          if git diff --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/biloo src/data/biloo.ts
          git commit -m "Format BILOO MVP source"
          git push origin HEAD:agent/biloo-mvp-foundation
