name: Format BILOO implementation

on:
  push:
    branches:
      - agent/biloo-super-app-foundation

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/biloo-super-app-foundation

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Format BILOO files
        run: npx prettier --write src/app/biloo/page.tsx src/components/biloo-super-app.tsx

      - name: Remove one-time formatter workflow
        run: git rm .github/workflows/format-biloo.yml

      - name: Commit formatted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/biloo/page.tsx src/components/biloo-super-app.tsx
          git commit -m "Format BILOO implementation"
          git push origin HEAD:agent/biloo-super-app-foundation
