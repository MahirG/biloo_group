name: Format Biloo MVP

on:
  push:
    branches:
      - agent/biloo-super-app-mvp

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Format Biloo files
        run: npx prettier --write "src/app/biloo/page.tsx" "src/app/projects/[slug]/page.tsx"

      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/biloo/page.tsx 'src/app/projects/[slug]/page.tsx'
          if git diff --cached --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git commit -m "Format Biloo MVP files"
          git push origin HEAD:${{ github.ref_name }}
