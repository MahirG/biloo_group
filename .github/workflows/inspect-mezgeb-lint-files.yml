name: Inspect Mezgeb lint source

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  capture:
    if: github.head_ref == 'agent/import-full-biloo-mezgeb'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Mezgeb source
        uses: actions/checkout@v4
        with:
          repository: MahirG/MezgebOfficial
          ref: archive/biloo-mezgeb-source

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Format target files
        run: |
          npm install --no-audit --no-fund --silent
          npx prettier --write components/mezgeb-mobile-controls.tsx components/pricing-section.tsx components/experience-orchestrator.tsx

      - name: Upload target files
        uses: actions/upload-artifact@v4
        with:
          name: mezgeb-lint-source-files
          path: |
            components/mezgeb-mobile-controls.tsx
            components/pricing-section.tsx
            components/experience-orchestrator.tsx
          retention-days: 3
