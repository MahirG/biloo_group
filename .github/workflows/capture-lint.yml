name: Capture lint diagnostics

on:
  push:
    branches: [agent/iq-game-hamburger]

permissions:
  contents: write

jobs:
  capture:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/iq-game-hamburger

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Capture lint output
        run: npm run lint > lint-output.txt 2>&1 || true

      - name: Commit diagnostics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lint-output.txt
          git commit -m "Capture lint diagnostics"
          git push origin HEAD:agent/iq-game-hamburger
