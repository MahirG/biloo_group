name: Format Nature Match world

on:
  pull_request:

permissions:
  contents: write

jobs:
  format:
    if: github.head_ref == 'agent/nature-match-world-format' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/nature-match-world-format

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Format source
        run: npm run format

      - name: Validate formatted source
        run: |
          npm run lint
          npm run typecheck
          npm run build
          npm run format:check

      - name: Remove one-time workflow
        run: rm .github/workflows/format-nature-world.yml

      - name: Commit formatted source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Format and validate Nature Match world"
          git push origin HEAD:agent/nature-match-world-format
