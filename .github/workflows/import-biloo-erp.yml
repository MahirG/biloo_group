name: Import complete Biloo ERP

on:
  push:
    branches: [agent/import-complete-biloo-erp]

permissions:
  contents: write

jobs:
  import:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Biloo platform branch
        uses: actions/checkout@v4
        with:
          ref: agent/import-complete-biloo-erp
          fetch-depth: 1

      - name: Clone current Biloo ERP source
        run: git clone --depth 1 --branch main https://github.com/MahirG/HisabERP.git /tmp/biloo-erp-source

      - name: Import ERP into Biloo monorepo
        shell: bash
        run: |
          rm -rf apps/biloo-erp
          mkdir -p apps/biloo-erp
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='node_modules' \
            --exclude='.next' \
            --exclude='.vercel' \
            --exclude='.env*' \
            /tmp/biloo-erp-source/ apps/biloo-erp/

          cat > apps/biloo-erp/MIGRATION_SOURCE.md <<'EOF'
          # Biloo ERP source migration

          This directory contains the complete Biloo ERP application imported into the Biloo Group repository.

          - Canonical repository: `MahirG/biloo_group`
          - Application root: `apps/biloo-erp`
          - Legacy source repository: `MahirG/HisabERP` (temporary rollback reference only)
          - Deployment root directory: `apps/biloo-erp`

          The imported application includes the dashboard, authentication flows, Supabase integration, database migrations, accounting modules, inventory, purchasing, sales, finance, HR, reports, tests, public assets, and operational documentation.
          EOF

          python - <<'PY'
          import json
          from pathlib import Path

          package_path = Path('apps/biloo-erp/package.json')
          package = json.loads(package_path.read_text())
          package['name'] = 'biloo-erp'
          package['private'] = True
          package_path.write_text(json.dumps(package, indent=2) + '\n')
          PY

          rm -f .biloo-erp-import-trigger

      - name: Validate imported ERP
        working-directory: apps/biloo-erp
        run: |
          npm install
          npm run typecheck
          npm test
          npm run build

      - name: Commit complete ERP import
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import complete Biloo ERP application"
          git push origin HEAD:agent/import-complete-biloo-erp
