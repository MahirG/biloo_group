name: Apply React effect lint fixes

on:
  push:
    branches: [agent/iq-game-hamburger]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/iq-game-hamburger

      - name: Apply focused fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          header_path = Path("src/components/site-header.tsx")
          header = header_path.read_text()
          header = header.replace(
              '''  useEffect(() => {\n    setMenuOpen(false);\n  }, [pathname]);\n\n''',
              ''
          )
          header_path.write_text(header)

          game_path = Path("src/components/color-sort-game.tsx")
          game = game_path.read_text()

          old_load = '''  useEffect(() => {\n    try {\n      const saved = window.localStorage.getItem(STORAGE_KEY);\n      if (saved) {\n        const parsed = JSON.parse(saved) as Partial<GameProgress>;\n        const merged: GameProgress = {\n          ...defaultProgress,\n          ...parsed,\n          completed: parsed.completed ?? {},\n          stickers: parsed.stickers ?? [],\n        };\n        const allowed = availableThemes(merged);\n        if (!allowed.includes(merged.theme)) merged.theme = "classic";\n        setProgress(merged);\n        setLevelNumber(Math.min(16, Math.max(1, merged.highestUnlocked)));\n        setShowDemo(!merged.demoSeen);\n      } else {\n        setShowDemo(true);\n      }\n    } catch {\n      setProgress(defaultProgress);\n      setShowDemo(true);\n    } finally {\n      setHydrated(true);\n    }\n  }, []);\n'''

          new_load = '''  useEffect(() => {\n    const timer = window.setTimeout(() => {\n      try {\n        const saved = window.localStorage.getItem(STORAGE_KEY);\n        if (saved) {\n          const parsed = JSON.parse(saved) as Partial<GameProgress>;\n          const merged: GameProgress = {\n            ...defaultProgress,\n            ...parsed,\n            completed: parsed.completed ?? {},\n            stickers: parsed.stickers ?? [],\n          };\n          const allowed = availableThemes(merged);\n          if (!allowed.includes(merged.theme)) merged.theme = "classic";\n          setProgress(merged);\n          setLevelNumber(Math.min(16, Math.max(1, merged.highestUnlocked)));\n          setShowDemo(!merged.demoSeen);\n        } else {\n          setShowDemo(true);\n        }\n      } catch {\n        setProgress(defaultProgress);\n        setShowDemo(true);\n      } finally {\n        setHydrated(true);\n      }\n    }, 0);\n\n    return () => window.clearTimeout(timer);\n  }, []);\n'''

          old_level = '''  useEffect(() => {\n    const state = createLevelState(level);\n    setPool(state.pool);\n    setRods(state.rods);\n    setSelectedBeadId(null);\n    setDrag(null);\n    dragRef.current = null;\n    setMistakes(0);\n    setWrongKey("");\n    setWrongRepeats(0);\n    setWrongBeadId(null);\n    setHintRod(null);\n    setCompleteStars(null);\n    setMemoryVisible(true);\n\n    if (level.memory) {\n      const timer = window.setTimeout(() => setMemoryVisible(false), 4200);\n      return () => window.clearTimeout(timer);\n    }\n\n    return undefined;\n  }, [level]);\n'''

          new_level = '''  useEffect(() => {\n    const state = createLevelState(level);\n    const resetTimer = window.setTimeout(() => {\n      setPool(state.pool);\n      setRods(state.rods);\n      setSelectedBeadId(null);\n      setDrag(null);\n      dragRef.current = null;\n      setMistakes(0);\n      setWrongKey("");\n      setWrongRepeats(0);\n      setWrongBeadId(null);\n      setHintRod(null);\n      setCompleteStars(null);\n      setMemoryVisible(true);\n    }, 0);\n    const memoryTimer = level.memory\n      ? window.setTimeout(() => setMemoryVisible(false), 4200)\n      : null;\n\n    return () => {\n      window.clearTimeout(resetTimer);\n      if (memoryTimer !== null) window.clearTimeout(memoryTimer);\n    };\n  }, [level]);\n'''

          if old_load not in game:
              raise SystemExit("Initial progress effect not found")
          if old_level not in game:
              raise SystemExit("Level reset effect not found")

          game = game.replace(old_load, new_load).replace(old_level, new_level)
          game_path.write_text(game)
          PY

          rm -f lint-output.txt
          rm -f .github/workflows/capture-lint.yml
          rm -f .github/workflows/apply-lint-fix.yml

      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix React effect lint errors"
          git push origin HEAD:agent/iq-game-hamburger
