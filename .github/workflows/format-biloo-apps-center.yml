name: Format Biloo Apps Center

on:
  push:
    branches:
      - agent/biloo-apps-center

permissions:
  contents: write

concurrency:
  group: format-biloo-apps-center
  cancel-in-progress: true

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/biloo-apps-center
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund --silent

      - name: Format Apps Center files
        run: npx prettier --write src/app/apps/page.tsx src/components/biloo-apps-center.tsx

      - name: Commit formatter output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/apps/page.tsx src/components/biloo-apps-center.tsx
          if git diff --cached --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git commit -m "Format Biloo Apps Center"
          git push origin HEAD:agent/biloo-apps-center
