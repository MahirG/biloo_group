name: Capture Nature Match diagnostics

on:
  push:
    branches: [agent/nature-match-expansion]

permissions:
  contents: write

jobs:
  capture:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/nature-match-expansion
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Capture diagnostics
        shell: bash
        run: npm run typecheck > type-errors.txt 2>&1 || true
      - name: Commit diagnostics
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add type-errors.txt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Capture Nature Match type diagnostics"
          git push origin HEAD:agent/nature-match-expansion
